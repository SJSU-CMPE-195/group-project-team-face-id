name: CI

on:
  push:
    branches: [main, wired-main]
  pull_request:
    branches: [main, wired-main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build

  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test dependencies
        run: python -m pip install 'flask>=3,<4'
      - name: Compile Python sources
        run: >-
          python -m compileall -q
          db.py db_api.py pi_device_api.py mock_pi_device_api.py
          car_face_auth/src/pi_runtime.py
          car_face_auth/src/simulated_runtime.py
          car_face_auth/src/face_engine.py
          car_face_auth/src/api_server.py
      - name: Validate deployment scripts
        run: |
          bash -n install.sh
          grep -q 'pi_device_api.py' systemd/faceid-api.service
          test ! -e systemd/faceid-verify.service
      - name: Run Python unit tests
        run: python -B -m unittest discover -s tests -v
